<!DOCTYPE html>
<head>
    <link rel="icon" th:href="@{../static/favicon.ico}" type="image/ico">
</head>
<div class="container">

    <div th:if="${!isAuthenticated}">
        <a href="oauth2/authorization/keycloak">
            <button class="btn btn-lg btn-primary btn-block"
                    type="button">Login
            </button>
        </a>
    </div>
    <div th:if="${isAuthenticated}">
        <p>Hi <span th:utext="${name}">..!..</span>!</p>
        <a href="logout">
            <button class="btn btn-lg btn-primary" type="button">Logout</button>
        </a>
        <a href="admin" th:if="${isNice}">
            <button class="btn btn-lg btn-primary" type="button">Browse to admin panel</button>
        </a>
    </div>
</div>
